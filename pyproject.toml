[project]
name = "lunora"
version = "0.1.0"
description = "Мультисистемный астрологический оракул — Telegram Mini App"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "skyfield==1.55",  # эфемериды ADR-001; закреплено: builtin ΔT/секунды координации = детерминизм
    "httpx>=0.28",
    "pyyaml>=6.0",  # реестры timeplace (tz_disputes)
    "tzdata==2026.6",  # IANA 2026f — закреплено (R-52); смена только с отчётом влияния
    "aiohttp-socks>=0.9",
]

[project.scripts]
lunora-forecast = "lunora.forecast.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "pyyaml>=6.0",
]
# оракулы и эталонные данные — только тесты и спайки, не рантайм (ENGINE-SOURCES §6, ADR-001)
oracle = [
    "pyswisseph==2.10.3.2",  # Swiss Ephemeris 2.10.03 — оракул дифф-тестов эфемерид/ведики (tests/diff)
    "lunar-python>=1.3",  # оракул Ба-Цзы (tests/diff/test_bazi_oracle); рантайм не зависит
    "cnlunar>=0.2",  # второй оракул Ба-Цзы (tests/diff/test_bazi_oracle); снят из рантайма в S2e
    # timezonefinder снят в S2e: зона — ближайший город вендоренного GeoNames (calc/timezone.py)
    # geonamescache снят: GeoNames — вендоренный снимок data/vendor/geonames (2026-11-21)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 99
# docs/ — архив Discovery (инструменты гейтов), не продуктовый код; решение Антона 2026-11-20
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# тексты интерпретаций и промтов — длинные строки естественны
"src/lunora/interpret/planets.py" = ["E501"]
"src/lunora/interpret/portrait.py" = ["E501"]
"src/lunora/llm/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# full — длинные дифф-прогоны (make spike-full); по умолчанию не идут. Явный -m full перекрывает.
addopts = "-m 'not full'"
markers = [
    "full: длинный дифф-прогон против оракула (make spike-full)",
]
