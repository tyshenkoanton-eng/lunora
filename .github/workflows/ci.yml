name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docs-discipline:
    name: docs discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docs discipline (fail-closed)
        run: python scripts/docs_discipline.py --docs docs

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [ docs-discipline ]   # добавляй сюда lint/test по мере появления job'ов
    if: ${{ always() }}         # НЕ success(): иначе скипнутый required-чек зачтётся пройденным
    steps:
      - name: Assert all required checks passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {n: d.get("result") for n, d in needs.items() if d.get("result") != "success"}
          if bad:
              for n, r in sorted(bad.items()):
                  print(f"{n}: {r}")
              raise SystemExit("One or more required CI jobs did not succeed.")
          print("All required CI jobs passed.")
          PY
